<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neural Drive</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Spline+Sans:wght@400;600&display=swap");

    :root {
      --bg: radial-gradient(circle at 20% 20%, #1e2d3d 0%, #0a0f14 45%, #050608 100%);
      --panel-bg: rgba(10, 12, 18, 0.8);
      --panel-border: rgba(255, 255, 255, 0.12);
      --accent: #fbbf24;
      --text: #f4f6fb;
      --muted: rgba(244, 246, 251, 0.7);
      --button-bg: #111827;
      --button-border: rgba(255, 255, 255, 0.2);
      --button-hover: #1f2937;
      --shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Spline Sans", "Trebuchet MS", sans-serif;
      overflow: hidden;
    }

    #renderCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    .menu {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      padding: 24px;
    }

    .menu-card {
      width: min(92vw, 420px);
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      padding: 28px;
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      pointer-events: auto;
    }

    .menu-title {
      font-family: "Unbounded", "Impact", sans-serif;
      font-size: clamp(2rem, 6vw, 2.75rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0 0 12px;
    }

    .menu-subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0 0 24px;
      line-height: 1.5;
    }

    .menu-actions {
      display: grid;
      gap: 12px;
    }

    .menu-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--button-border);
      background: var(--button-bg);
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: transform 0.2s ease, background 0.2s ease, border 0.2s ease;
      cursor: pointer;
    }

    .menu-button:hover {
      background: var(--button-hover);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
    }

    .menu-button span {
      color: var(--accent);
      font-weight: 700;
    }

    .menu-footer {
      margin-top: 20px;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    @media (max-width: 640px) {
      .menu-card {
        padding: 22px;
      }
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas" aria-label="Babylon.js scene"></canvas>
  <div class="menu">
    <div class="menu-card">
      <h1 class="menu-title">Neural Drive</h1>
      <p class="menu-subtitle">Train a car, wire a brain, and race the network. Prototype menu screen.</p>
      <div class="menu-actions">
        <button class="menu-button" type="button">Start Run <span>01</span></button>
        <button class="menu-button" type="button">Garage <span>02</span></button>
        <button class="menu-button" type="button">Options <span>03</span></button>
      </div>
      <div class="menu-footer">
        <span>Babylon.js</span>
        <span>v0.1</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="main.js"></script>
</body>
</html>
